<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Illustration: a family walking towards a village government office at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d58f"/>
      <stop offset="0.55" stop-color="#f8e3b2"/>
      <stop offset="1" stop-color="#f4e7c8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c77a"/>
      <stop offset="1" stop-color="#7f9a4c"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ead2a0"/>
      <stop offset="1" stop-color="#d9b77a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.6" stop-color="#f5a841"/>
      <stop offset="1" stop-color="#f5a841" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="540" fill="url(#sky)"/>
  <circle cx="300" cy="230" r="70" fill="url(#sun)" opacity="0.85"/>
  <circle cx="300" cy="230" r="30" fill="#f7b443"/>
  <!-- distant hills -->
  <path d="M0 290 Q90 230 180 270 T360 255 T540 265 T720 240 V360 H0Z" fill="#c9c08a" opacity="0.7"/>
  <path d="M0 310 Q120 270 240 300 T480 290 T720 285 V380 H0Z" fill="#a9b56f" opacity="0.8"/>
  <!-- temple silhouette -->
  <g fill="#c99a63" opacity="0.75">
    <rect x="455" y="215" width="30" height="70"/>
    <path d="M450 215 L470 165 L490 215Z"/>
    <rect x="468" y="150" width="4" height="16"/>
    <rect x="410" y="245" width="40" height="40"/>
    <rect x="495" y="240" width="40" height="45"/>
  </g>
  <!-- ground -->
  <path d="M0 340 Q200 315 360 330 T720 320 V540 H0Z" fill="url(#ground)"/>
  <!-- office building -->
  <g>
    <rect x="490" y="250" width="200" height="120" fill="#f3efe4"/>
    <rect x="480" y="238" width="220" height="16" rx="3" fill="#3f8a87"/>
    <rect x="475" y="232" width="230" height="8" rx="3" fill="#2f6f6c"/>
    <rect x="560" y="210" width="80" height="24" fill="#f3efe4"/>
    <rect x="555" y="204" width="90" height="8" rx="2" fill="#3f8a87"/>
    <g fill="#3f8a87">
      <rect x="505" y="275" width="26" height="36" rx="2"/>
      <rect x="649" y="275" width="26" height="36" rx="2"/>
      <rect x="580" y="285" width="40" height="85" rx="3" fill="#24504e"/>
    </g>
    <g fill="#e9e1cf">
      <rect x="566" y="270" width="8" height="100"/>
      <rect x="626" y="270" width="8" height="100"/>
    </g>
    <rect x="560" y="370" width="80" height="8" fill="#d8cfbb"/>
    <rect x="552" y="378" width="96" height="8" fill="#cfc5af"/>
    <rect x="544" y="386" width="112" height="8" fill="#c6bba4"/>
    <!-- flag -->
    <rect x="598" y="150" width="3" height="56" fill="#6b6b6b"/>
    <rect x="601" y="152" width="34" height="8" fill="#f08a24"/>
    <rect x="601" y="160" width="34" height="8" fill="#ffffff"/>
    <rect x="601" y="168" width="34" height="8" fill="#2f8a3b"/>
    <circle cx="618" cy="164" r="2.6" fill="none" stroke="#1d3f8f" stroke-width="1"/>
  </g>
  <!-- path to the office -->
  <path d="M250 540 C300 470 430 430 560 394 L640 394 C600 430 520 480 470 540Z" fill="url(#path)"/>
  <!-- tree -->
  <g>
    <path d="M70 540 C80 450 95 380 92 300 L112 300 C112 380 120 450 140 540Z" fill="#6b4a2b"/>
    <path d="M100 330 C130 300 170 300 200 280" stroke="#6b4a2b" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="70" cy="215" r="70" fill="#5c8b3c"/>
    <circle cx="150" cy="190" r="72" fill="#6e9c45"/>
    <circle cx="215" cy="245" r="55" fill="#5c8b3c"/>
    <circle cx="20" cy="280" r="55" fill="#4f7d35"/>
    <circle cx="120" cy="265" r="60" fill="#79a64e"/>
    <circle cx="105" cy="140" r="50" fill="#86b25a"/>
  </g>
  <!-- bushes -->
  <g fill="#557f37">
    <circle cx="690" cy="470" r="50"/>
    <circle cx="640" cy="500" r="40"/>
    <circle cx="20" cy="500" r="45"/>
  </g>
  <!-- people (walking towards the office) -->
  <g transform="translate(330 360)">
    <!-- woman in green saree -->
    <ellipse cx="0" cy="170" rx="30" ry="6" fill="#000" opacity="0.12"/>
    <path d="M-22 40 C-28 90 -30 130 -26 168 L24 168 C24 120 20 80 18 40Z" fill="#2f7d4f"/>
    <path d="M-22 40 L18 40 L6 168 L-8 168Z" fill="#d68a2a" opacity="0.9"/>
    <path d="M-16 30 Q0 22 16 30 L18 46 L-20 46Z" fill="#c76b2a"/>
    <circle cx="0" cy="16" r="14" fill="#8a5a3b"/>
    <path d="M-14 12 Q0 -6 14 12 Q12 2 0 0 Q-12 2 -14 12Z" fill="#2b1d16"/>
    <path d="M-20 52 L-34 110" stroke="#8a5a3b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-38" cy="122" rx="16" ry="12" fill="#a8763f"/>
  </g>
  <g transform="translate(400 350)">
    <!-- elderly man -->
    <ellipse cx="0" cy="180" rx="30" ry="6" fill="#000" opacity="0.12"/>
    <path d="M-18 48 L18 48 L22 120 L-22 120Z" fill="#f2ead6"/>
    <path d="M-20 120 L-8 178 L-2 178 L0 125 L2 178 L8 178 L20 120Z" fill="#f7f1e2"/>
    <path d="M-24 46 Q0 34 24 46 L22 60 L-22 60Z" fill="#9db7a8"/>
    <circle cx="0" cy="26" r="15" fill="#9a6a48"/>
    <path d="M-12 32 Q0 44 12 32 Q6 40 0 40 Q-6 40 -12 32Z" fill="#e8e2d6"/>
    <path d="M-15 20 Q0 4 15 20" stroke="#e8e2d6" stroke-width="4" fill="none"/>
    <path d="M24 56 L40 178" stroke="#6b4a2b" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 60 L32 100" stroke="#9a6a48" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(468 365)">
    <!-- schoolgirl -->
    <ellipse cx="0" cy="160" rx="24" ry="5" fill="#000" opacity="0.12"/>
    <path d="M-16 40 L16 40 L18 100 L-18 100Z" fill="#f4f6f8"/>
    <path d="M-18 98 L18 98 L14 158 L-14 158Z" fill="#2f5d8a"/>
    <rect x="-22" y="44" width="16" height="44" rx="5" fill="#26465f"/>
    <circle cx="0" cy="22" r="13" fill="#8f5e3f"/>
    <path d="M-13 18 Q0 2 13 18 L13 26 Q0 14 -13 26Z" fill="#20160f"/>
    <path d="M10 26 Q18 50 12 70" stroke="#20160f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="14" y="70" width="14" height="20" rx="2" fill="#3f6fa0"/>
  </g>
  <!-- birds -->
  <g stroke="#7a5b3a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M380 120 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M420 100 q5 -5 10 0 q5 -5 10 0"/>
  </g>
</svg>
